name: Validate

on:
  pull_request:
    branches: [master, alpha, beta, stable]
  push:
    branches: [master, alpha, beta, stable]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Long-lived release branches must compare with their own previous
          # commit, not the repository default branch.
          base: ${{ github.ref }}
          filters: |
            frontend:
              - 'apps/web/**'
              - 'shared/brand/**'
              - 'tools/generate-og-images.tsx'
              - 'tools/validate-standalone-web.sh'
              - 'bun.lock'
              - 'package.json'
              - 'Makefile'
              - '.github/workflows/validate.yml'
            docs:
              - 'apps/docs-site/**'
              - 'apps/site/**'
              - 'docs/**'
              - '*.md'
              - 'scripts/**'
              - 'shared/brand/**'
              - 'tools/generate-og-images.tsx'
              - 'tools/materialize-docs-static-assets.ts'
              - 'tools/generate-release-index.test.ts'
              - 'tools/generate-release-index.ts'
              - 'tools/sync-install-scripts.sh'
              - 'tools/validate-required-result.sh'
              - 'tools/validation-contract.test.ts'
              - 'bun.lock'
              - 'package.json'
              - 'Makefile'
              - '.github/workflows/validate.yml'
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - '.github/workflows/validate.yml'

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: make format-oxc-check

      - name: Lint
        run: make lint-web

      - name: Test
        run: make test-web

      - name: Build, check bundle, and validate standalone server
        run: make bundle-check validate-web-launcher

      - name: Install Chromium
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Production browser smoke
        run: make test-web-ui

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        if: needs.changes.outputs.frontend != 'true'
        run: make format-oxc-check

      - name: Lint
        run: make lint-docs

      - name: Test
        run: make test-docs test-validation-contract test-release-index

      - name: Build
        run: make build-docs build-site

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-on-failure: true

      - name: Format check
        run: make fmt-rust-check

      - name: Clippy
        run: make clippy-rust

      - name: Test merge-critical Rust contracts
        run: make test-rust-pr

  required:
    name: Required validation
    if: ${{ always() }}
    needs: [changes, frontend, docs, rust]
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      RUST_RESULT: ${{ needs.rust.result }}
    steps:
      - uses: actions/checkout@v6
      - name: Evaluate path-aware validation
        run: make validate-required-result
