name: Validate

on:
  pull_request:
    branches: [master, alpha, beta, stable]
  push:
    branches: [master, alpha, beta, stable]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      rust: ${{ steps.filter.outputs.rust }}
      installer: ${{ steps.filter.outputs.installer }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On a PR update, compare only the new commit range. On PR open or
          # reopen, compare the PR base. Branch events use the prior commit.
          token: ''
          base: ${{ github.event.action == 'synchronize' && github.event.before || github.event.pull_request.base.sha || github.ref }}
          filters: |
            frontend:
              - 'apps/web/**'
              - 'shared/brand/**'
              - 'tools/validate-standalone-web.sh'
              - 'bun.lock'
              - 'package.json'
              - 'Makefile'
              - '.github/workflows/validate.yml'
            docs:
              - 'apps/docs/**'
              - 'apps/web/components.json'
              - 'apps/site/**'
              - 'shared/brand/**'
              - 'shared/media/product/**'
              - 'tools/sync-install-scripts.sh'
              - 'bun.lock'
              - 'package.json'
              - 'Makefile'
              - '.oxfmtrc.json'
              - '.github/workflows/validate.yml'
            rust:
              - 'crates/**'
              - 'apps/docs/public/openapi.json'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - '.github/workflows/validate.yml'
            installer:
              - 'scripts/install.sh'
              - 'scripts/install-acceptance.sh'
              - 'scripts/uninstall.sh'
              - 'scripts/uninstall-acceptance.sh'
              - 'tools/sync-install-scripts.sh'
              - 'Makefile'
              - '.github/workflows/validate.yml'
            release:
              - '.github/workflows/release.yml'
              - 'tools/release-smoke.sh'
              - 'Makefile'
              - '.github/workflows/validate.yml'

  tooling:
    name: Validation tooling
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install actionlint
        run: make install-actionlint

      - name: Validate workflows, shell helpers, and cheap behavior
        run: make validate-ci

      - name: Validate installer entrypoints
        if: needs.changes.outputs.installer == 'true' && needs.changes.outputs.release != 'true'
        run: make test-install

      - name: Validate hermetic release acceptance
        if: needs.changes.outputs.release == 'true'
        run: make release-smoke

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: make format-oxc-check

      - name: Lint
        run: make lint-web

      - name: Test
        run: make test-web

      - name: Build and validate standalone server
        run: make validate-web-launcher

  docs:
    name: Docs
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs == 'true'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        if: needs.changes.outputs.frontend != 'true'
        run: make format-oxc-check

      - name: Lint
        run: make lint-docs

      - name: Type check
        run: make check-docs-types

      - name: Build static output
        run: make build-docs build-site

  rust:
    name: Rust
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.rust == 'true'
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-on-failure: true

      - name: Format check
        run: make fmt-rust-check

      - name: Clippy
        run: make clippy-rust

      - name: Check generated OpenAPI
        run: make check-openapi

      - name: Test merge-critical Rust contracts
        run: make test-rust-pr

  required:
    name: Required validation
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [changes, tooling, frontend, docs, rust]
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      TOOLING_RESULT: ${{ needs.tooling.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      RUST_RESULT: ${{ needs.rust.result }}
    steps:
      - uses: actions/checkout@v6
      - name: Evaluate path-aware validation
        run: make validate-required-result
