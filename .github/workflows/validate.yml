name: Validate

on:
  pull_request:
    branches: [alpha, beta, stable]
  push:
    branches: [alpha, beta, stable]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      rust: ${{ steps.filter.outputs.rust }}
      installer: ${{ steps.filter.outputs.installer }}
      release: ${{ steps.filter.outputs.release }}
      scheduled_rust: ${{ steps.filter.outputs.scheduled_rust }}
      scheduled_browser: ${{ steps.filter.outputs.scheduled_browser }}
      scheduled_performance: ${{ steps.filter.outputs.scheduled_performance }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On a PR update, compare only the new commit range. On PR open or
          # reopen, compare the PR base. Branch events use the prior commit.
          token: ''
          base: ${{ github.event.action == 'synchronize' && github.event.before || github.event.pull_request.base.sha || github.ref }}
          filters: |
            frontend:
              - 'apps/web/**'
              - 'shared/brand/**'
              - 'tools/generate-og-images.tsx'
              - 'tools/validate-standalone-web.sh'
              - 'bun.lock'
              - 'package.json'
              - 'Makefile'
              - '.github/workflows/validate.yml'
            docs:
              - 'apps/docs/**'
              - 'apps/web/components.json'
              - 'apps/site/**'
              - 'crates/oore-contract/**'
              - 'crates/oored/Cargo.toml'
              - 'crates/oored/src/**'
              - 'docs/**'
              - 'research/**'
              - 'wayfinder/**'
              - '*.md'
              - 'scripts/**'
              - 'shared/brand/**'
              - 'shared/media/product/**'
              - 'tools/generate-og-images.tsx'
              - 'tools/generate-release-index.test.ts'
              - 'tools/generate-release-index.ts'
              - 'tools/sync-install-scripts.sh'
              - 'tools/validate-required-result.sh'
              - 'bun.lock'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'package.json'
              - 'Makefile'
              - '.oxfmtrc.json'
              - '.github/workflows/validate.yml'
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - '.github/workflows/validate.yml'
            installer:
              - 'scripts/install.sh'
              - 'scripts/uninstall.sh'
              - 'scripts/uninstall-acceptance.sh'
              - 'tools/sync-install-scripts.sh'
              - 'Makefile'
              - '.github/workflows/validate.yml'
            release:
              - '.github/workflows/release.yml'
              - 'tools/release-smoke.sh'
              - 'tools/release-smoke.test.ts'
              - 'Makefile'
              - '.github/workflows/validate.yml'
            scheduled_rust:
              - '.github/workflows/scheduled-confidence.yml'
              - 'crates/oored/tests/audit_logs_integration.rs'
              - 'crates/oored/tests/oidc_start_integration.rs'
              - 'crates/oored/tests/web_performance_integration.rs'
              - 'Makefile'
              - '.github/workflows/validate.yml'
            scheduled_browser:
              - '.github/workflows/scheduled-confidence.yml'
              - 'apps/web/playwright.scheduled.config.ts'
              - 'apps/web/e2e/production-smoke.spec.ts'
              - 'apps/web/e2e/scheduled/**'
              - 'apps/web/package.json'
              - 'Makefile'
              - '.github/workflows/validate.yml'
            scheduled_performance:
              - '.github/workflows/scheduled-confidence.yml'
              - 'tools/web-performance-baseline.*'
              - 'tools/web-runtime-performance.*'
              - 'Makefile'
              - '.github/workflows/validate.yml'

  tooling:
    name: Validation tooling
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install actionlint
        run: make install-actionlint

      - name: Validate workflows, shell helpers, and cheap behavior
        run: make validate-ci

      - name: Validate hermetic release acceptance
        if: needs.changes.outputs.release == 'true'
        run: make release-smoke

      - name: Install scheduled browsers
        if: needs.changes.outputs.scheduled_browser == 'true'
        run: make install-web-browsers-scheduled

      - name: Validate scheduled browser samples
        if: needs.changes.outputs.scheduled_browser == 'true'
        run: make test-web-ui-scheduled

      - name: Validate scheduled performance helpers
        if: needs.changes.outputs.scheduled_performance == 'true'
        run: make test-web-runtime-performance-report

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: make format-oxc-check

      - name: Lint
        run: make lint-web

      - name: Test
        run: make test-web

      - name: Build and validate standalone server
        run: make validate-web-launcher

      - name: Install Chromium
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Production browser smoke
        run: make test-web-ui

  docs:
    name: Docs
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs == 'true'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        if: needs.changes.outputs.frontend != 'true'
        run: make format-oxc-check

      - name: Lint
        run: make lint-docs

      - name: Test source contracts
        run: make test-docs-source

      - name: Verify commit-bound editorial review
        run: make test-docs-editorial

      - name: Type check
        run: make check-docs-types

      - name: Build static output
        run: make build-docs build-site

      - name: Verify static output
        run: make test-docs-build

      - name: Install Chromium
        run: make install-docs-browser

      - name: Production browser smoke
        run: make test-docs-browser

  rust:
    name: Rust
    needs: changes
    if: needs.changes.result == 'success' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.scheduled_rust == 'true')
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-on-failure: true

      - name: Format check
        run: make fmt-rust-check

      - name: Clippy
        run: make clippy-rust

      - name: Test merge-critical Rust contracts
        if: needs.changes.outputs.scheduled_rust != 'true'
        run: make test-rust-pr

      - name: Test scheduled Rust contracts
        if: needs.changes.outputs.scheduled_rust == 'true'
        run: make test-rust-scheduled

  required:
    name: Required validation
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [changes, tooling, frontend, docs, rust]
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      TOOLING_RESULT: ${{ needs.tooling.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      RUST_RESULT: ${{ needs.rust.result }}
    steps:
      - uses: actions/checkout@v6
      - name: Evaluate path-aware validation
        run: make validate-required-result
